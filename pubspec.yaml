name: gg_fake_stopwatch
description: A stopwatch that is in sync with FakeAsync.elapsed. Use this stopwatch in tests using fakeAsync.
version: 1.2.4
repository: https://github.com/inlavigo/gg_fake_stopwatch

environment:
  sdk: ">=3.13.0 <4.0.0"

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.1.0
  test: ^1.31.2
  flutter_lints: ^6.0.0
  args: ^2.7.0
  gg_capture_print: ^1.1.0